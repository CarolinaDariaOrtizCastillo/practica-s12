apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: cluster-s12
  region: us-east-1
  version: "1.34"

iam:
  serviceRoleARN: "arn:aws:iam::[ID_IAM]:role/LabRole"

vpc:
  nat:
    gateway: "Disable"

managedNodeGroups:
  - name: nodos-app
    instanceType: t3.medium
    desiredCapacity: 2
    iam:
      instanceRoleARN: "arn:aws:iam::[ID_IAM]:role/LabRole"
